<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thêm và xóa hàng trong Table </title>
  <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

<link rel="stylesheet" type="text/css" href="style.css">

</head>
<body style="border:1px solid grey">
  	<h2>Quản lý thông tin user</h2>
    <form>
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="email" placeholder="Email Address">
        <input type="text" placeholder="Birthdate" id="datepicker">
    	<input type="button" class="add-row" value="Add Row">
    </form>
    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>Name</th>
                <th>Email</th>
                <th>Birthdate</th>
            </tr>
        </thead>
        <tbody>
           
        </tbody>
    </table>
    <button type="button" class="delete-row">Delete Row</button>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
  <script>
  $(function () {
    // Datepicker định dạng dd/mm/yyyy
    $("#datepicker").datepicker({
      dateFormat: "dd/mm/yy",
      changeMonth: true,
      changeYear: true,
      yearRange: "1920:+0",
      maxDate: 0
    });

    var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function isValidDate(str) {
      try {
        $.datepicker.parseDate("dd/mm/yy", str);
        return true;
      } catch (e) {
        return false;
      }
    }

    // Thêm hàng
    $(".add-row").on("click", function () {
      var name = $.trim($("#name").val());
      var email = $.trim($("#email").val());
      var birthdate = $.trim($("#datepicker").val());

      if (!name) {
        alert("Vui lòng nhập Name.");
        $("#name").focus();
        return;
      }
      if (!emailRegex.test(email)) {
        alert("Email không đúng định dạng (ví dụ: ten@example.com).");
        $("#email").focus();
        return;
      }
      if (!isValidDate(birthdate)) {
        alert("Birthdate không hợp lệ. Định dạng đúng: dd/mm/yyyy.");
        $("#datepicker").focus();
        return;
      }

      var $row = $("<tr>")
        .append($("<td>").append($('<input type="checkbox" name="record">')))
        .append($("<td>").text(name))
        .append($("<td>").text(email))
        .append($("<td>").text(birthdate));
      $("table tbody").append($row);

      $("form")[0].reset();
      $("#name").focus();
    });

    // Xóa các hàng đã tích chọn
    $(".delete-row").on("click", function () {
      var $checked = $("table tbody input[name='record']:checked");
      if ($checked.length === 0) {
        alert("Vui lòng tích chọn hàng cần xóa.");
        return;
      }
      $checked.closest("tr").remove();
    });
  });
  </script>
</body>
</html>
